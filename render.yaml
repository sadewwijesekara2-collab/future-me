services:
  - type: web
    name: future-me-api          # your URL will be https://future-me-api.onrender.com
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false              # you type this in the Render dashboard (never in GitHub)
      - key: ALLOWED_ORIGINS
        value: https://sadewwijesekara2-collab.github.io
      - key: PYTHON_VERSION
        value: 3.11.9
